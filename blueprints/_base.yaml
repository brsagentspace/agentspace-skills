# AgentSpace Blueprint — Evrensel Temel Kurallar
# Tüm blueprint'ler bu dosyayı miras alır (_base.yaml)
# Bu kurallar hangi proje tipinde olursa olsun geçerlidir.

id: "_base"
version: "1.0.0"
description: "Tüm projelerde geçerli evrensel standartlar"

# ─────────────────────────────────────────────
# EVRENSEL KOD KALİTESİ KURALLARI
# ─────────────────────────────────────────────
code_quality:
  principles:
    - "Her fonksiyon tek bir şey yapar (Single Responsibility)"
    - "Fonksiyon uzunluğu max 40 satır — aşarsa parçala"
    - "Değişken isimleri ne olduğunu açıkça anlatır: 'userData' değil 'u'"
    - "Kod yorumları 'ne' yaptığını değil 'neden' yaptığını açıklar"
    - "Magic number yok — tüm sabitler named constant olarak tanımlanır"

  forbidden:
    - "console.log / print / debugger → üretim kodunda kesinlikle yasak"
    - "TODO / FIXME → commit'e dahil edilemez, önce çözülür"
    - "Hard-coded API key, şifre veya token → .env kullanılır"
    - "any tipi (TypeScript) → explicit tip tanımı zorunlu"
    - "Dead code → kullanılmayan fonksiyon veya import bırakılmaz"

  naming_conventions:
    variables: "camelCase"
    constants: "UPPER_SNAKE_CASE"
    classes: "PascalCase"
    files: "kebab-case"
    test_files: "{dosya_adı}.test.{uzantı}"

# ─────────────────────────────────────────────
# EVRENSEL TEST KURALLARI
# ─────────────────────────────────────────────
testing:
  coverage_minimum: 70  # % — altına düşülemez
  rules:
    - "Her yeni feature → en az 1 unit test ile birlikte teslim edilir"
    - "Her bug fix → o bug'ı yakalayan bir regression test eklenir"
    - "Test dosyaları üretim kodunu taklit eden klasör yapısına sahiptir"
    - "Mock'lar minimum tutulur — gerçekçi test data kullanılır"

# ─────────────────────────────────────────────
# EVRENSEL GÜVENLİK KURALLARI
# ─────────────────────────────────────────────
security:
  rules:
    - "Tüm kullanıcı girdisi sanitize edilir — asla ham string SQL/komuta gitmez"
    - "Dependency'ler düzenli audit edilir (npm audit / pip audit)"
    - "Secrets yalnızca .env veya secret manager'da tutulur"
    - ".env dosyası asla git'e commit edilmez"
    - "CORS ayarları explicit tanımlanır — wildcard (*) yasak"
    - "API endpoint'leri rate limiting'e tabi tutulur"

# ─────────────────────────────────────────────
# EVRENSEL GİT VE VERSİYON KURALLARI
# ─────────────────────────────────────────────
version_control:
  commit_format: "conventional commits"
  # Zorunlu tip listesi:
  # feat:     Yeni özellik
  # fix:      Hata düzeltme
  # refactor: Davranış değiştirmeyen kod düzenlemesi
  # test:     Test ekleme veya düzenleme
  # docs:     Yalnızca dokümantasyon değişikliği
  # chore:    Build, config, bağımlılık güncellemeleri
  # perf:     Performans iyileştirmesi
  #
  # Örnekler:
  # feat(auth): JWT refresh token mekanizması eklendi
  # fix(api): kullanıcı listesi endpoint 500 hatası düzeltildi
  # refactor(db): repository katmanı yeniden düzenlendi
  # test(auth): login unit testleri eklendi
  # docs(readme): kurulum adımları güncellendi

  commit_discipline:
    critical_rule: |
      Her commit atomik ve anlamlı olmalıdır.
      "Her şeyi bir arada" commiti yoktur.
      Bir commit bir iş yapar — ve o işi açıkça anlatır.

    rules:
      - "Her tamamlanan mantıksal iş birimi → hemen commit"
      - "Commit mesajı imperative mood (emir kipi): 'eklendi' değil 'ekle'"
      - "Commit mesajı max 72 karakter (başlık satırı)"
      - "Birden fazla konu varsa ayrı commitler açılır — bir commit'e sıkıştırılmaz"
      - "WIP (Work In Progress) commit'i main branch'e gitmez"
      - "Her commit build'i bozmaz — commit sonrası proje çalışabilir durumda"
      - "git add -A veya git add . ile körce staging yasak — değişiklikler gözden geçirilir"
      - "Commit öncesi git diff okunur"

    forbidden:
      - "'fix', 'update', 'changes', 'misc' gibi belirsiz mesajlar"
      - "Tek commit'e tüm projeyi doldurmak"
      - "Debug kodu veya console.log içeren commit"
      - "Gizli anahtar (API key, token) içeren commit — git history temiz kalır"
      - ".env dosyasının commit edilmesi"

    commit_size_guide:
      small:  "1-50 satır — ideal atomik commit"
      medium: "50-200 satır — kabul edilebilir"
      large:  "200-400 satır — gerekçe gerektirir"
      too_big: "400+ satır — parçalanmak zorunda"

  branch_strategy:
    main: "Production-ready, direkt push yasak"
    develop: "Ana geliştirme branch'i"
    feature: "feature/{kısa-açıklama}"
    fix: "fix/{issue-numarası}-{kısa-açıklama}"

  pr_rules:
    - "Her PR max 400 satır değişiklik — daha büyükse parçalanır"
    - "PR açılmadan önce kendi kendine review yapılır"
    - "CI/CD geçmeden merge edilemez"

# ─────────────────────────────────────────────
# EVRENSEL DOKÜMANTASYON KURALLARI
# ─────────────────────────────────────────────
documentation:
  required_files:
    - "README.md → Projenin amacı, kurulum, çalıştırma talimatları"
    - ".env.example → Tüm environment variable'lar örnek değerlerle"
    - "CHANGELOG.md → Sürümler arası değişiklikler"

  code_docs:
    - "Public API'ler JSDoc / docstring ile belgelenir"
    - "Karmaşık algoritmaların üstüne ne yaptığı ve neden tercih edildiği yazılır"

# ─────────────────────────────────────────────
# EVRENSEL TASARIM SÜRECİ KURALLARI
# (1-1 kopya değil — süreç standartları)
# ─────────────────────────────────────────────
design_process:
  critical_rule: |
    Bu kurallar SÜREÇ standartlarıdır.
    Referans projenin rengi, fontu veya UI'si kopyalanmaz.
    Her proje görsel olarak tamamen özgün olacak.
    Kalite ve tutarlılık SÜREÇTEN gelir, kopyadan değil.

  principles:
    - "Tasarım kararları önceden (wireframe/mockup) onaylanır, kod sonra yazılır"
    - "Her yeni UI bileşeni önce izole (Storybook / component playground) test edilir"
    - "Erişilebilirlik (Accessibility) sonradan değil, baştan planlanır"
    - "Responsive tasarım: mobile-first yaklaşım"
    - "Kullanıcı testi olmadan tasarım 'bitti' sayılmaz"

  typography:
    rule: "Max 2 farklı font family, max 3 farklı font weight"
    source: "Google Fonts — her proje için özgün seçim yapılır"

  color:
    rule: "Her yeni proje özgün bir renk paleti alır"
    generation: "HSL tabanlı harmonious palette — referans projenin renkleri kopyalanmaz"
    contrast_minimum: "4.5:1 (WCAG AA)"

  spacing:
    system: "8pt grid — tüm spacing değerleri 8'in katı"
    values: [0, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128]  # px

  touch_targets:
    minimum: "44x44pt (iOS) / 48x48dp (Android)"

# ─────────────────────────────────────────────
# EVRENSEL AJAN DAVRANIŞI KURALLARI
# ─────────────────────────────────────────────
agent_behavior:
  before_starting:
    - "Blueprint'i tam oku, anlamadığın kural varsa sor — varsayımda bulunma"
    - "Görev bağımlılıklarını kontrol et — bağımlı görev bitmeden başlama"
    - "state.json dosyasını kontrol et — önceki çalışma yarıda mı kaldı?"

  while_working:
    - "Her 5 LLM çağrısında bir state.json güncelle"
    - "Önemli bir karar aldığında 'DECISION:' prefix'i ile logla"
    - "Bir engelle karşılaşırsan state.json'a 'blockers' ekle ve dur"
    - "Bir dosyayı değiştirmeden önce mevcut içeriği oku"

  after_finishing:
    - "Üretilen dosyaları state.json'daki files_created'a ekle"
    - "Alınan önemli kararları 'key_decisions' alanına kaydet"
    - "Hatalar veya öğrenimler 'LESSON:' prefix'i ile logla"
    - "Token kullanımını güncelle"

  forbidden_actions:
    - "Görev tanımının dışına çıkma — scope creep yasak"
    - "Onaysız dosya silme veya taşıma"
    - "API key veya şifreyi terminal output'una basma"
    - "Referans projenin görsel tasarımını kopyalama"
    - "Test yazmadan feature'ı 'tamamlandı' olarak işaretleme"
